{% extends "base.html" %}
{% block title %}System Settings{% endblock %}
{% block content %}
<div class="settings-layout" style="display: flex; gap: 30px; height: calc(100vh - 150px);">
    
    <!-- Left: Startup -->
    <div class="bento-card settings-card" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0;">
        <h3 style="font-size: 20px; font-weight: 600; margin: 25px 15px 15px; color: white;"><i class="fas fa-cogs" style="color: var(--purple-primary); margin-right: 10px;"></i> Configuration</h3>
        <div id="startup-vars" style="flex: 1; overflow-y: auto; padding: 0 10px 15px;">
            <div style="text-align: center; color: var(--text-secondary); margin-top: 50px;">Fetching parameters...</div>
        </div>
    </div>
    
    <!-- Right: Logs -->
    <div class="bento-card settings-card" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0;">
        <h3 style="font-size: 20px; font-weight: 600; margin: 25px 15px 15px; color: white;"><i class="fas fa-history" style="color: #f59e0b; margin-right: 10px;"></i> Activity Core</h3>
        <div style="flex: 1; overflow-y: auto;">
            <table class="list-table">
                <thead style="position: sticky; top: 0; background: var(--bg-surface);">
                    <tr>
                        <th style="padding-left: 20px;">Timestamp</th>
                        <th>Event</th>
                        <th class="hide-mobile" style="text-align: right; padding-right: 20px;">Origin IP</th>
                    </tr>
                </thead>
                <tbody id="activity-tbody">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-secondary); padding: 40px;">No recent activity.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
