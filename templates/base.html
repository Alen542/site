<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ self.title() }} - WakandaPanel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=10">
    <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.min.js"></script>
    <!-- CodeMirror for Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Thin Discord-style Sidebar -->
        <nav class="app-sidebar">
            <div class="sidebar-logo"><i class="fa-solid fa-bolt"></i></div>
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" title="Dashboard"><i class="fas fa-home"></i></a>
            <a href="/files" class="nav-item {% if request.path == '/files' %}active{% endif %}" title="Storage"><i class="fas fa-folder-open"></i></a>
            <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}" title="Settings"><i class="fas fa-sliders-h"></i></a>
            
            <a href="#" class="nav-item nav-logout" title="Logout" onclick="document.getElementById('logout-modal').style.display='flex'; return false;"><i class="fas fa-power-off"></i></a>
        </nav>
        
        <!-- Main Content Area -->
        <main class="app-main">
            <header class="app-header">
                <h2>{% block title %}Dashboard{% endblock %}</h2>
                <div class="user-profile">
                    <i class="fas fa-user-astronaut" style="color: var(--purple-primary); font-size: 18px;"></i>
                    <span style="font-size: 14px; font-weight: 500;">Server Admin</span>
                </div>
            </header>
            
            <div class="app-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Custom Logout Modal -->
    <div id="logout-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(8px);">
        <div class="bento-card" style="width: 90%; max-width: 380px; text-align: center; padding: 40px 30px; animation: modalScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            <i class="fas fa-power-off" style="font-size: 50px; color: #ef4444; margin-bottom: 25px; filter: drop-shadow(0 0 15px rgba(239,68,68,0.5));"></i>
            <h3 style="color: white; font-size: 24px; margin-bottom: 12px; font-weight: 600; font-family: 'Outfit';">System Disconnect</h3>
            <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 35px; font-family: 'Outfit';">Are you sure you want to terminate your session and return to the login port?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn-action" style="flex: 1; height: 48px; border-radius: 14px; font-weight: 600; width: auto; font-family: 'Outfit'; border: 1px solid #333; background: #111;" onclick="document.getElementById('logout-modal').style.display='none'">Cancel</button>
                <button class="btn-action danger" style="flex: 1; height: 48px; border-radius: 14px; font-weight: 600; background: #ef4444; color: white; border: none; width: auto; font-family: 'Outfit';" onclick="window.location.href='/logout'">Disconnect</button>
            </div>
        </div>
    </div>
    
    <!-- Custom Minimal Toasts -->
    <div id="toast-container" style="position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 12px;"></div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
